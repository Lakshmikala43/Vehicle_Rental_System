<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vehicle Catalog & Filters – RentRide</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboards.css">
</head>
<body>

  <!-- NAVIGATION HEADER WITH OFFICIAL CAR & BIKE LOGO -->
  <header class="rf-header">
    <a href="../index.html" class="rf-brand">
      <img src="../assets/logo.jpg" alt="RentRide Logo" class="rf-brand-img">
      <div style="font-size:1.55rem; font-weight:900; letter-spacing:-0.5px;">Rent<span style="color:var(--rf-accent-yellow-bright);">Ride</span></div>
    </a>
    <ul class="rf-nav">
      <li><a href="./customer-dashboard.html">My Rentals & Bookings</a></li>
      <li><a href="./search.html" class="active">Search Vehicles</a></li>
    </ul>
    <div id="navAuthActions" class="rf-header-actions"></div>
  </header>

  <main class="rf-container" style="padding-top:2.5rem;">
    <div style="margin-bottom:2rem;">
      <h1 class="rf-section-title">Vehicle & Bike Search Catalog</h1>
      <p class="rf-section-subtitle">Filter our RentRide fleet by category (SUV, Sedan, Hatchback, Motorbike, EV), fuel type, or transmission.</p>
    </div>

    <!-- FILTER BAR -->
    <div style="background:#FFFFFF; border:2px solid var(--rf-border-light); border-radius:var(--rf-radius-lg); padding:1.5rem; margin-bottom:2.2rem; box-shadow:var(--rf-shadow-sm);">
      <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)) auto; gap:1.2rem; align-items:end;">
        <div class="rf-form-group">
          <label>Vehicle Category</label>
          <select id="filterCategory" class="rf-form-control" onchange="App.loadCatalogVehicles()">
            <option value="">All Categories (Cars & Bikes)</option>
            <option value="SUV">SUV</option>
            <option value="Sedan">Sedan</option>
            <option value="Hatchback">Hatchback</option>
            <option value="Motorbike">Motorbike</option>
            <option value="Electric">Electric Vehicle (EV)</option>
          </select>
        </div>
        <div class="rf-form-group">
          <label>Fuel Type</label>
          <select id="filterFuel" class="rf-form-control" onchange="App.loadCatalogVehicles()">
            <option value="">All Fuel Types</option>
            <option value="PETROL">Petrol</option>
            <option value="DIESEL">Diesel</option>
            <option value="ELECTRIC">Electric</option>
          </select>
        </div>
        <div class="rf-form-group">
          <label>Transmission</label>
          <select id="filterTransmission" class="rf-form-control" onchange="App.loadCatalogVehicles()">
            <option value="">All Transmissions</option>
            <option value="AUTOMATIC">Automatic</option>
            <option value="MANUAL">Manual</option>
          </select>
        </div>
        <button onclick="App.loadCatalogVehicles()" class="rf-btn rf-btn-primary" style="padding:0.75rem 1.6rem;">Apply Filters</button>
      </div>
    </div>

    <!-- CATALOG VEHICLES GRID -->
    <div id="searchVehiclesCatalogGrid" class="rf-grid-3"></div>
  </main>

  <footer class="rf-footer">
    <div class="rf-footer-bottom">
      <div>&copy; 2026 RentRide System. All rights reserved.</div>
    </div>
  </footer>

  <script src="../js/api-client.js"></script>
  <script src="../js/auth-manager.js"></script>
  <script src="../js/payment-simulator.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
